name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref: experiments are long and CI minutes are not free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build all modules
        run: mvn -B -ntp clean install -DskipTests

      # Includes an end-to-end hop against a real embedded broker, which is what proves the
      # acknowledged-event contract, causal linkage and ledger writes still hold.
      - name: Run tests
        run: mvn -B -ntp test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore
          retention-days: 14

  compose-config:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate experiment compose
        run: docker compose -f docker-compose.experiment.yml config --quiet
