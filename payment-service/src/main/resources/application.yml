server:
  port: 8082

spring:
  application:
    name: payment-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service

recoveryguard:
  topics:
    orders: orders
    payments: payments

management:
  endpoints:
    web:
      exposure:
        include: health,info
