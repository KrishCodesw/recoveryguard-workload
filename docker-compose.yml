# # Local single-broker Kafka for fast iteration on the workload services.
# #
# # This is NOT the environment RecoveryGuard experiments run against -- real
# # failure/recovery scenarios need the multi-broker Strimzi cluster defined
# # in recoveryguard-infra. Use this compose file only for "does my service
# # code work at all" development loops.


