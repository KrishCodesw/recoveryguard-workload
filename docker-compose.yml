# Local single-broker Kafka for fast iteration on the workload services.
#
# This is NOT an experiment environment. A single broker with replication.factor 1 cannot exhibit
# replica lag, ISR shrinkage, or unclean leader election -- so no RecoveryGuard verdict produced
# against it means anything. `acks=all` here degrades to "the one replica has it".
#
# For real failure/recovery experiments use docker-compose.experiment.yml (3 brokers, RF=3,
# min.insync.replicas=2), or the Strimzi cluster in recoveryguard-infra once it exists.
#
# Services start with RECOVERYGUARD_CLUSTER_PROFILE=dev, which makes the cluster-contract guard
# WARN rather than abort. It will warn: that warning is correct and expected here.

services:
  kafka:
    image: apache/kafka:3.7.1
    container_name: recoveryguard-dev-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: fT8qHltMTW6PkKGyw9Tl9g
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RECOVERYGUARD_CLUSTER_PROFILE: dev
      RECOVERYGUARD_LEDGER_PATH: /app/runs
      RECOVERYGUARD_EXPERIMENT_ID: ${RECOVERYGUARD_EXPERIMENT_ID:-dev-local}
    volumes:
      - ./runs:/app/runs
    depends_on:
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RECOVERYGUARD_CLUSTER_PROFILE: dev
      RECOVERYGUARD_LEDGER_PATH: /app/runs
      RECOVERYGUARD_EXPERIMENT_ID: ${RECOVERYGUARD_EXPERIMENT_ID:-dev-local}
    volumes:
      - ./runs:/app/runs
    depends_on:
      kafka:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RECOVERYGUARD_CLUSTER_PROFILE: dev
      RECOVERYGUARD_LEDGER_PATH: /app/runs
      RECOVERYGUARD_EXPERIMENT_ID: ${RECOVERYGUARD_EXPERIMENT_ID:-dev-local}
    volumes:
      - ./runs:/app/runs
    depends_on:
      kafka:
        condition: service_healthy

  # One-shot workload generator. Writes the run manifest and the expected-state record under ./runs.
  #   docker compose run --rm workload-driver --workload.orders=1000 --workload.seed=42
  workload-driver:
    build:
      context: .
      dockerfile: workload-driver/Dockerfile
    environment:
      ORDER_SERVICE_URL: http://order-service:8081
      RECOVERYGUARD_LEDGER_PATH: /app/runs
      RECOVERYGUARD_EXPERIMENT_ID: ${RECOVERYGUARD_EXPERIMENT_ID:-dev-local}
      WORKLOAD_ORDERS: "100"
      WORKLOAD_SEED: "20260926"
    volumes:
      - ./runs:/app/runs
    depends_on:
      - order-service
    profiles:
      - driver
